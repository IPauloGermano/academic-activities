<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOLT — Tênis para ir além</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="header">
      <img class="header_logo" src="images/tenis/logo/icon.png" alt="VOLT" />
    </header>
    <hr class="divider">
    <main>
      <section class="icons">
        <p class="icons_intro">Astros da marca</p>

        <div class="grid">
          <div class="card_box">
            <img
              src="images/tenis/VOLT%20Cyborb%202/front.png"
              alt="VOLT Cyborb 2 "
            />
          </div>

          <div class="card_box">
            <img
              src="images/tenis/VOLT%20Ikill%204/front.png"
              alt="VOLT Ikill "
            />
          </div>

          <div class="card_box">
            <img
              src="images/tenis/VOLT%20Amp%203/front.png"
              alt="VOLT Amp 3 "
            />
          </div>

          <div class="card_box">
            <img
              src="images/tenis/VOLT%20Surge%2001/front.png"
              alt="VOLT Surge"
            />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
